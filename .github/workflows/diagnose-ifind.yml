name: Diagnose iFinD realtime response

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnose_ifind.py"
      - ".github/workflows/diagnose-ifind.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspect one safe iFinD market-data response
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        run: python diagnose_ifind.py
