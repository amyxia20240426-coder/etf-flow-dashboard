name: Update ETF daily history

on:
  workflow_dispatch:
  schedule:
    # Weekdays 18:30 Beijing time (10:30 UTC), after daily fund data settles.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: etf-data-update
  cancel-in-progress: false

jobs:
  update-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update confirmed daily subscription history
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
          UPDATE_MODE: daily
          FULL_METADATA_REFRESH: "false"
        run: python update_data.py

      - name: Commit changed data
        run: |
          git config user.name "etf-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json data/master.json data/market_history.json
          git diff --cached --quiet || git commit -m "Update ETF daily subscription history"
          git push
